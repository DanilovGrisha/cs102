льный и низкокачественный контент. Неоригинальным контентом считаются видео, импортированные или загруженные из других источников (например, из социальных сетей, телешоу, фильмов или веб-трансляций) без какой-либо творческой обработки. Если на видео есть водяной знак или логотип, оно считается неоригинальным. Низкокачественным контентом считаются очень короткие видео, статичные изображения и видео, содержащие только GIF-анимацию. Кроме того, в ленту «Рекомендации» обычно не попадает контент с QR-кодами, так как они могут вести на вредоносные веб-сайты или приложения. Исключение составляют случаи, когда риск пренебрежимо мал (например, для видео, связанных с электронной коммерцией).","vid_mod_analytics_nr_vid_penalty_reason_unoriginal_title":"Неоригинальный контент, контент низкого качества и QR-коды в видео","vid_mod_analytics_nr_vid_penalty_reason_unoriginal_desc":"Чтобы все пользователи TikTok получали удовольствие от просмотра видео, в рекомендации не попадает неоригинальный и низкокачественный контент. Неоригинальным контентом считаются видео, импортированные или скопированные из других источников без какой-либо творческой обработки. Если на видео есть водяной знак или логотип, оно считается неоригинальным. Низкокачественным контентом считаются очень короткие видео, статичные изображения и видео, содержащие только GIF-анимацию.","vid_mod_analytics_nr_acct_penalty_reason_unoriginal_title":"Скопированный аккаунт","vid_mod_analytics_nr_acct_penalty_reason_unoriginal_desc":"Ваш аккаунт содержит неоригинальные публикации, поэтому ваши видео не появляются в ленте «Рекомендации». Подробности см. в разделе «Правила сообщества» \u003E «Неприемлемый контент в ленте \"Для вас\"» \u003E «Неоригинальный контент, контент низкого качества и QR-коды в видео».","vid_mod_analytics_penalty_reason_spam_title":"Спам, фальшивый или вводящий в заблуждение контент","vid_mod_analytics_penalty_reason_spam_desc":"В ленту «Рекомендации» не попадает контент, предназначенный для увеличения количества подписчиков, лайков, просмотров или других показателей вовлеченности на платформе мошенническим или обманным путем. Это могут быть призывы подписываться на автора или ставить ему лайки, а также контент, в котором пользователей обманом заставляют нажимать на кнопки «Лайк» или «Поделиться». Кроме того, в ленту «Рекомендации» не попадает контент, предназначенный для распространения теорий заговора и неправдивой или вредоносной информации о текущих событиях и событиях, о которых еще мало сведений.","vid_mod_analytics_penalty_reason_sexual_title":"Излишне сексуализированный контент","vid_mod_analytics_penalty_reason_sexual_desc":"Чтобы каждый пользователь видел в приложении подходящий для его мировоззрения контент, видео с сексуальными намеками могут быть исключены из рекомендаций. Это относится к контенту, в котором подразумевается нагота, сексуально демонстрируются части тела или показаны откровенно эротические или чувственные действия (например, стриптиз).","vid_mod_analytics_penalty_reason_tobacco_title":"Табак и алкоголь","vid_mod_analytics_penalty_reason_tobacco_desc":"В ленту «Рекомендации» не попадает контент, в котором пропагандируется, упоминается или демонстрируется безответственное и опасное употребление алкоголя совершеннолетними лицами. Кроме того, в рекомендации не попадает контент, в котором взрослые употребляют табачные изделия или упоминают запрещенные вещества.","vid_mod_analytics_penalty_reason_stunts_title":"Опасные трюки и виды спорта","vid_mod_analytics_penalty_reason_stunts_desc":"Некоторые действия при повторении любителями без соответствующих мер предосторожности могут быть опасными и привести к травмам. Контент с опасными трюками и видео, в которых непрофессионалы занимаются опасными видами спорта, не попадает в ленту «Рекомендации».","vid_mod_analytics_penalty_reason_graphic_title":"Жестокость и шокирующий контент","vid_mod_analytics_penalty_reason_graphic_desc":"В ленту «Рекомендации» не попадает контент, который может вызвать у зрителя дискомфорт, шок или отвращение, включая видео со страшными эффектами, скримерами, реалистичным гримом в виде кровавых ран и изображениями телесных отправлений. Большую часть контента, содержащего жестокость и насилие, в TikTok публиковать нельзя, однако в некоторых случаях мы разрешаем публикацию контента определенного типа, такого как натуралистичное изображение смерти, катастроф или военных действий, который служит для документирования реальных событий и вызывает общественный интерес. Такой контент может быть неприемлемым для некоторых пользователей, поэтому он не попадает в рекомендации. Перед просмотром такого видео зритель увидит предупреждение и должен будет подтвердить свое желание его смотреть.","vid_mod_analytics_penalty_reason_fyf_title":"Не подходит для ленты «Рекомендации»","vid_mod_analytics_penalty_reason_fyf_desc":"Ваше видео не соответствует стандартам для попадания в ленту «Рекомендации». Подробности см. в разделе Правил сообщества TikTok «Неприемлемый контент в ленте \"Рекомендации\"».","vidModAnalytics_detailPg_sectionHumanMod_sectionBody":"Пользователи и сторонние лица могут отправлять нам жалобы на контент, нарушающий Правила сообщества. Мы обнаружили это нарушение правил в результате рассмотрения такой жалобы.","vidModAnalytics_detailPg_sectionVideoDetails_sectionLabel":"Сведения о видео","vid_mod_analytics_appeal_detailpg_reason_title":"Причина нарушения","vid_mod_analytics_detail_pg_title":"Видео не попадет в рекомендации","vid_mod_analytics_detail_pg_desc":"Это видео не показывается в ленте «Рекомендации», так как оно нарушает Правила сообщества.","vidModAnalytics_detailPg_sectionSuccess_header":"Апелляция одобрена","vid_mod_analytics_appeal_success_detail_pg_desc":"Мы рассмотрели вашу апелляцию и восстановили видео. Приносим извинения за доставленные неудобства. Спасибо, что остаетесь с нами!","vid_mod_analytics_appeal_detail_pg_title":"Видео удалено","vid_mod_analytics_appeal_detail_pg_desc":"Этот видео нарушает наши Правила сообществ
